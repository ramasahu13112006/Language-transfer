<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Language Translator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 27, 75, 0.9)), 
                        url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 920px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 65px;
            height: 65px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
        }

        .header h1 {
            font-size: 2.3rem;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .translator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #cbd5e1;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        select {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: #1e1b4b;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 190px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.35);
        }

        .btn {
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(124, 58, 237, 0.4);
        }

        .action-btn {
            background: rgba(96, 165, 250, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.4);
            color: #60a5fa;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(96, 165, 250, 0.4);
            color: #fff;
        }

        .action-btn.recording {
            background: rgba(239, 68, 68, 0.4);
            border-color: rgba(239, 68, 68, 0.8);
            color: #fca5a5;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .badge {
            background: rgba(59, 130, 246, 0.25);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #60a5fa;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        /* =======================================
           📱 MEDIA QUERIES (Responsive Design)
           ======================================= */

        /* Tablets & Mobile Screens (Up to 768px) */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .glass-card {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .translator-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            textarea {
                height: 150px;
            }
        }

        /* Small Mobile Devices (Up to 480px) */
        @media (max-width: 480px) {
            .header-icon {
                width: 50px;
                height: 50px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.85rem !important;
            }

            .action-btn {
                padding: 4px 8px;
                font-size: 0.78rem;
            }

            select {
                padding: 6px 10px;
                font-size: 0.85rem;
                width: 100%;
            }

            .box-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .btn {
                padding: 12px 18px;
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="header">
        <img src="https://cdn-icons-png.flaticon.com/512/3898/3898082.png" alt="Translate Icon" class="header-icon">
        <h1>Universal Translator</h1>
        <p style="color: #cbd5e1; font-size: 0.95rem;">Auto-detect source language & convert seamlessly</p>
    </div>

    <div class="translator-grid">
        <!-- Input Section -->
        <div class="box">
            <div class="box-header">
                <div class="header-controls">
                    <span>Input Text</span>
                    <!-- 🎙️ Voice Input Button -->
                    <button class="action-btn" id="micBtn" onclick="startSpeechRecognition()" title="Speak to Type">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                        <span id="micStatus">Speak</span>
                    </button>
                    <!-- 🔊 Speaker for Input -->
                    <button class="action-btn" onclick="playAudio('inputText', currentDetectedLang)" title="Listen Input Text">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        Listen
                    </button>
                </div>
                <span id="detectedBadge" class="badge" style="display: none;">Detected: -</span>
            </div>
            <textarea id="inputText" placeholder="Type or click 'Speak' to talk..."></textarea>
        </div>

        <!-- Output Section -->
        <div class="box">
            <div class="box-header">
                <div class="header-controls">
                    <span>Target Language</span>
                    <!-- 🔊 Speaker for Output -->
                    <button class="action-btn" onclick="playAudio('outputText', document.getElementById('targetLang').value)" title="Listen Translation">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        Listen
                    </button>
                </div>
                <select id="targetLang">
                    {% for code, name in languages.items() %}
                        <option value="{{ code }}" {% if code == 'hi' %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
            <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>
        </div>
    </div>

    <button class="btn" onclick="translateText()">Translate Now</button>
</div>

<script>
    let currentDetectedLang = 'en';

    // Pre-load Web Speech API voices
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    // 🎙️ Speech Recognition
    function startSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('Your browser does not support Speech Recognition. Please use Chrome, Edge, or Safari.');
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        const inputText = document.getElementById('inputText');

        recognition.onstart = function() {
            micBtn.classList.add('recording');
            micStatus.innerText = 'Listening...';
        };

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('recording');
            micStatus.innerText = 'Speak';
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            inputText.value = transcript;
            translateText();
        };

        recognition.onerror = function(event) {
            micBtn.classList.remove('recording');
            micStatus.innerText = 'Speak';
            console.error('Speech recognition error:', event.error);
        };

        recognition.start();
    }

    async function translateText() {
        const text = document.getElementById('inputText').value;
        const targetLang = document.getElementById('targetLang').value;
        const outputArea = document.getElementById('outputText');
        const badge = document.getElementById('detectedBadge');

        if (!text.trim()) {
            alert('Please enter or speak some text!');
            return;
        }

        outputArea.value = 'Translating...';

        try {
            const response = await fetch('/translate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, target_lang: targetLang })
            });

            const data = await response.json();

            if (data.success) {
                outputArea.value = data.translated_text;
                currentDetectedLang = data.detected_lang.toLowerCase();
                badge.innerText = `Detected: ${data.detected_lang}`;
                badge.style.display = 'inline-block';
            } else {
                outputArea.value = 'Error: ' + data.error;
            }
        } catch (err) {
            outputArea.value = 'Failed to connect to server.';
            console.error(err);
        }
    }

    function getBCP47Tag(code) {
        const langMap = {
            'hi': 'hi-IN', 'en': 'en-US', 'es': 'es-ES', 'fr': 'fr-FR',
            'de': 'de-DE', 'zh': 'zh-CN', 'ja': 'ja-JP', 'ru': 'ru-RU',
            'ar': 'ar-SA', 'bn': 'bn-IN', 'ta': 'ta-IN', 'te': 'te-IN',
            'mr': 'mr-IN', 'gu': 'gu-IN', 'kn': 'kn-IN', 'pa': 'pa-IN'
        };
        return langMap[code.toLowerCase()] || code;
    }

    function playAudio(elementId, langCode) {
        const text = document.getElementById(elementId).value;

        if (!text.trim() || text === 'Translating...' || text.startsWith('Error:')) {
            alert('No valid text available to play!');
            return;
        }

        if (!('speechSynthesis' in window)) {
            alert('Your browser does not support text-to-speech.');
            return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const formattedLang = getBCP47Tag(langCode || 'en');
        utterance.lang = formattedLang;
        utterance.rate = 0.95;

        const voices = window.speechSynthesis.getVoices();
        const matchedVoice = voices.find(v => v.lang.toLowerCase() === formattedLang.toLowerCase() || v.lang.startsWith(langCode));
        
        if (matchedVoice) {
            utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
